<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>시스템팀 체크리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#eef1f3;--panel:#fff;--ink:#15212b;--muted:#5f6d78;--line:#d6dde2;--soft:#e8ecef;
  --accent:#d98a00;--accent-soft:#fdf0d6;--ok:#1f8a5b;--ok-soft:#ddf3e8;--wip:#2f6fb5;--wip-soft:#e0ecf9;--todo:#b9480f;--todo-soft:#fbe9df;
  --t-snd:#2f6fb5;--t-lgt:#d98a00;--t-fx:#8a4fd1;--t-vid:#0f8f8f;--t-str:#6b5b45;--t-pwr:#b9480f;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161c;--panel:#17212a;--ink:#e6edf2;--muted:#9aa8b3;--line:#2a3743;--soft:#1f2b35;
  --accent:#f0a826;--accent-soft:#3a2c10;--ok:#4cc38a;--ok-soft:#163327;--wip:#6aa6e8;--wip-soft:#172a40;--todo:#f08a5d;--todo-soft:#3a2117;
  --t-snd:#6aa6e8;--t-lgt:#f0a826;--t-fx:#b48cf0;--t-vid:#3fc7c7;--t-str:#c2a882;--t-pwr:#f08a5d;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c;--panel:#17212a;--ink:#e6edf2;--muted:#9aa8b3;--line:#2a3743;--soft:#1f2b35;
  --accent:#f0a826;--accent-soft:#3a2c10;--ok:#4cc38a;--ok-soft:#163327;--wip:#6aa6e8;--wip-soft:#172a40;--todo:#f08a5d;--todo-soft:#3a2117;
  --t-snd:#6aa6e8;--t-lgt:#f0a826;--t-fx:#b48cf0;--t-vid:#3fc7c7;--t-str:#c2a882;--t-pwr:#f08a5d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{margin:0;text-wrap:balance;line-height:1.3}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{padding:30px 0 4px;display:flex;flex-direction:column;gap:8px}
.label{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
header h1{font-size:clamp(1.5rem,4vw,2rem)}
header p{margin:0;color:var(--muted);font-size:.9rem}
.back{font-size:.85rem;color:var(--wip)}
/* overview */
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ov a{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:inherit;border-top:4px solid var(--c)}
.ov b{font-size:.95rem}
.ov small{font-size:.72rem;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);width:0;transition:width .3s}
.ov .n{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.tg-btn{font:inherit;font-size:.85rem;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.tg-btn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.total{margin-left:auto;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
/* team */
.team{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;scroll-margin-top:60px}
.th{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:14px 18px;border-left:6px solid var(--c)}
.th h2{font-size:1.1rem}
.vendor{font-size:.8rem;color:var(--muted)}
.th .n{margin-left:auto;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.when{padding:8px 18px;background:var(--soft);font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.when b{color:var(--ink);font-weight:600}
.it{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer}
.it input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ok);cursor:pointer}
.it .t{font-weight:600;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.it .q{font-size:.88rem;margin-top:3px}
.it .q::before{content:"물어볼 것 · ";color:var(--muted);font-size:.78rem}
.it .c{font-size:.8rem;color:var(--muted);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:.7rem;padding:1px 7px;border-radius:5px;background:var(--soft);color:var(--muted)}
.pill{font-size:.68rem;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.p-1{color:var(--todo);background:var(--todo-soft)}
.p-w{color:var(--wip);background:var(--wip-soft)}
.it.done .t,.it.done .q{text-decoration:line-through;color:var(--muted)}
.it.done{background:var(--ok-soft)}
.hide-done .it.done{display:none}
details.etc{background:var(--panel);border:1px solid var(--line);border-radius:10px}
details.etc summary{padding:14px 18px;cursor:pointer;font-weight:700;list-style:none}
details.etc summary::-webkit-details-marker{display:none}
details.etc summary small{font-weight:400;color:var(--muted);margin-left:6px}
.note{font-size:.78rem;color:var(--muted)}
@media (max-width:560px){.th,.it,.when{padding-left:14px;padding-right:14px}}
</style></head><body>
<div class="wrap">
  <header>
    <div class="label">UNFOLD X 2026 · 메인홀 · 시스템팀</div>
    <h1>시스템팀 체크리스트</h1>
    <p>음향 · 조명 · 특효 · 영상 · 구조물 팀에 확인할 것. 개막 세레모니 관련은 빠져 있어요. 체크하면 이 기기에 저장돼요.</p>
    <a class="back" href="./">← 테크라이더 메인으로</a>
  </header>
  <nav class="ov" id="ov"></nav>
  <div class="tools">
    <button class="tg-btn" id="hide" aria-pressed="false">끝난 것 숨기기</button>
    <button class="tg-btn" id="first" aria-pressed="false">우선만 보기</button>
    <span class="total" id="total"></span>
  </div>
  <div id="teams" style="display:flex;flex-direction:column;gap:14px"></div>
  <details class="etc"><summary>시스템팀 말고 다른 쪽 확인할 것<small>운영 · 작가 · 재단 — 참고</small></summary><div id="etc"></div></details>
  <p class="note">기준: 테크라이더 원본, 큐시트(11/7), 메인홀 시스템 일정표(11/5), 중간보고서(10/30), 조명도면(11/5). 체크 표시는 이 브라우저에만 저장돼서 폰과 PC가 따로예요.</p>
</div>

const K="ux-check-v1";let st={};try{st=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const id=it=>it[0]+"|"+it[2];
document.getElementById("teams").innerHTML=TEAMS.map(([k,n,v,c,w])=>{
 const its=ITEMS.filter(i=>i[0]===k).sort((a,b)=>(b[1]==="1")-(a[1]==="1"));
 return `<section class="team" id="t-${k}" style="--c:var(${c})"><div class="th"><h2>${n}</h2><span class="vendor">${esc(v)}</span><span class="n" data-n="${k}"></span></div>
 <div class="when">${w.map(x=>`<span><b>${x[0]}</b> ${esc(x[1])}</span>`).join("")}</div>
 ${its.map(i=>`<label class="it${i[1]==="1"?" first":""}" data-id="${esc(id(i))}"><input type="checkbox"><div><div class="t">${esc(i[2])}${i[1]==="1"?'<span class="pill p-1">우선</span>':""}</div><div class="q">${esc(i[3])}</div>${i[4]?`<div class="c">${esc(i[4])}</div>`:""}<div class="chips">${i[5].split(" · ").map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div></div></label>`).join("")}</section>`}).join("");
document.getElementById("etc").innerHTML=ETC.map(e=>{const i=["etc","",e[0],e[1]];return `<label class="it" data-id="${esc("etc|"+e[0])}"><input type="checkbox"><div><div class="t">${esc(e[0])}</div>${e[1]?`<div class="c">${esc(e[1])}</div>`:""}</div></label>`}).join("");
function upd(){let all=0,dn=0;
 document.querySelectorAll(".it").forEach(l=>{const d=!!st[l.dataset.id];l.querySelector("input").checked=d;l.classList.toggle("done",d);});
 document.getElementById("ov").innerHTML=TEAMS.map(([k,n,v,c])=>{const its=ITEMS.filter(i=>i[0]===k),d=its.filter(i=>st[id(i)]).length;all+=its.length;dn+=d;
  const s=document.querySelector(`[data-n="${k}"]`);if(s)s.textContent=`${d} / ${its.length}`;
  return `<a href="#t-${k}" style="--c:var(${c})"><b>${n}</b><div class="bar"><i style="width:${its.length?d/its.length*100:0}%"></i></div><span class="n">${d} / ${its.length}</span></a>`}).join("");
 document.getElementById("total").textContent=`전체 ${dn} / ${all}`;}
document.addEventListener("change",e=>{const l=e.target.closest(".it");if(!l)return;if(e.target.checked)st[l.dataset.id]=1;else delete st[l.dataset.id];save();upd();});
const tg=(b,cls)=>b.addEventListener("click",()=>{const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);document.body.classList.toggle(cls,on);});
tg(document.getElementById("hide"),"hide-done");
const f=document.getElementById("first");f.addEventListener("click",()=>{const on=f.getAttribute("aria-pressed")!=="true";f.setAttribute("aria-pressed",on);document.querySelectorAll(".team .it").forEach(l=>l.hidden=on&&!l.classList.contains("first"));});
